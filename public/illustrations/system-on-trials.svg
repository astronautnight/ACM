<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="400" height="360">
  <defs>
    <filter id="chalk" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" seed="12" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
      <feMorphology in="displaced" operator="dilate" radius="0.3" result="thickened"/>
      <feGaussianBlur in="thickened" stdDeviation="0.35"/>
    </filter>
  </defs>

  <g filter="url(#chalk)" stroke="#b8860b" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- ==================== BACKGROUND ACCENTS & TECH SPARKS ==================== -->
    <path d="M 65 45 L 65 57 M 59 51 L 71 51" stroke-width="1.8" opacity="0.45" />
    <path d="M 335 45 L 335 57 M 329 51 L 341 51" stroke-width="1.8" opacity="0.45" />
    <path d="M 200 22 L 200 34 M 194 28 L 206 28" stroke-width="2" opacity="0.5" />
    
    <!-- Judicial Radiance / Sound Waves -->
    <path d="M 140 85 Q 120 105 140 125" stroke-width="2" opacity="0.4" />
    <path d="M 260 85 Q 280 105 260 125" stroke-width="2" opacity="0.4" />

    <!-- Circuit traces on the courtroom pillars -->
    <path d="M 45 150 L 80 150 L 95 170 L 95 240" stroke-width="1.8" stroke-dasharray="4, 4" opacity="0.4" />
    <circle cx="45" cy="150" r="3" stroke-width="2" opacity="0.6" />
    <path d="M 355 150 L 320 150 L 305 170 L 305 240" stroke-width="1.8" stroke-dasharray="4, 4" opacity="0.4" />
    <circle cx="355" cy="150" r="3" stroke-width="2" opacity="0.6" />

    <!-- ==================== 1. SCALES OF JUSTICE (CENTER & LEFT) ==================== -->
    <g id="scales-of-justice">
      <!-- Central Pillar Base -->
      <path d="M 165 295 L 235 295" stroke-width="4" />
      <path d="M 175 288 L 225 288" stroke-width="3" />
      <path d="M 185 280 L 215 280" stroke-width="2.5" />
      
      <!-- Central Column -->
      <line x1="200" y1="55" x2="200" y2="280" stroke-width="3.8" />
      <circle cx="200" cy="52" r="7" stroke-width="3.5" />
      <circle cx="200" cy="52" r="2.5" stroke-width="2" />
      <polygon points="196,38 204,38 200,30" stroke-width="2.5" />

      <!-- Crossbar / Balance Beam -->
      <path d="M 100 80 Q 200 65 300 80" stroke-width="3.8" />
      <circle cx="100" cy="80" r="4.5" stroke-width="2.5" />
      <circle cx="300" cy="80" r="4.5" stroke-width="2.5" />

      <!-- Left Scale (Tilted slightly to reflect dynamic trial) -->
      <!-- Chains -->
      <line x1="97" y1="84" x2="72" y2="155" stroke-width="1.8" stroke-dasharray="3, 3" />
      <line x1="103" y1="84" x2="128" y2="155" stroke-width="1.8" stroke-dasharray="3, 3" />
      <line x1="100" y1="84" x2="100" y2="155" stroke-width="1.8" stroke-dasharray="3, 3" />
      <!-- Pan -->
      <path d="M 68 155 Q 100 178 132 155 Z" stroke-width="3" />
      <line x1="68" y1="155" x2="132" y2="155" stroke-width="2.5" />
      <!-- Tech data packet weighing on left pan -->
      <rect x="91" y="142" width="18" height="13" rx="2" stroke-width="2" />
      <line x1="95" y1="148" x2="105" y2="148" stroke-width="1.5" />

      <!-- Right Scale -->
      <!-- Chains -->
      <line x1="297" y1="84" x2="272" y2="168" stroke-width="1.8" stroke-dasharray="3, 3" />
      <line x1="303" y1="84" x2="328" y2="168" stroke-width="1.8" stroke-dasharray="3, 3" />
      <line x1="300" y1="84" x2="300" y2="168" stroke-width="1.8" stroke-dasharray="3, 3" />
      <!-- Pan -->
      <path d="M 268 168 Q 300 191 332 168 Z" stroke-width="3" />
      <line x1="268" y1="168" x2="332" y2="168" stroke-width="2.5" />
      <!-- Legal Exhibit X scroll weighing on right pan -->
      <path d="M 292 157 Q 300 152 308 157 L 308 167 Q 300 162 292 167 Z" stroke-width="2" />
    </g>

    <!-- ==================== 2. GAVEL & SOUND BLOCK (FOREGROUND) ==================== -->
    <g id="gavel-and-block" transform="translate(18, 12)">
      <!-- Sound Block (Hexagonal/Octagonal pedestal) -->
      <polygon points="120,295 190,295 210,312 140,312" stroke-width="3.5" />
      <polygon points="120,295 140,312 140,325 120,308" stroke-width="3" />
      <polygon points="140,312 210,312 210,325 140,325" stroke-width="3" />
      <!-- Strike impact rings -->
      <ellipse cx="165" cy="303" rx="20" ry="7" stroke-width="1.8" stroke-dasharray="4, 3" opacity="0.6" />
      <ellipse cx="165" cy="303" rx="32" ry="11" stroke-width="1.5" stroke-dasharray="5, 4" opacity="0.35" />

      <!-- Gavel resting dynamically at angle -->
      <g transform="translate(165, 290) rotate(-32) translate(-165, -290)">
        <!-- Sound block contact point: (165, 290) -->
        <!-- Gavel Head / Mallet -->
        <rect x="145" y="272" width="40" height="24" rx="4" stroke-width="3.5" />
        <!-- Bronze End Caps -->
        <path d="M 145 268 L 145 300" stroke-width="3.8" />
        <path d="M 140 270 Q 137 284 140 298" stroke-width="3" />
        <path d="M 185 268 L 185 300" stroke-width="3.8" />
        <path d="M 190 270 Q 193 284 190 298" stroke-width="3" />
        <!-- Head Inlay / Center Band -->
        <line x1="162" y1="272" x2="162" y2="296" stroke-width="2.5" />
        <line x1="168" y1="272" x2="168" y2="296" stroke-width="2.5" />

        <!-- Gavel Handle -->
        <path d="M 165 272 L 165 145" stroke-width="4.2" />
        <!-- Handle Grip / Rings -->
        <ellipse cx="165" cy="200" rx="4" ry="2" stroke-width="2" />
        <ellipse cx="165" cy="180" rx="4.5" ry="2" stroke-width="2" />
        <ellipse cx="165" cy="160" rx="5" ry="2.5" stroke-width="2.2" />
        <!-- Handle Pommel -->
        <circle cx="165" cy="142" r="6" stroke-width="3.5" />
      </g>
    </g>

    <!-- ==================== 3. COURT DOCKET & EXHIBIT X FOLDER (LEFT FOREGROUND) ==================== -->
    <g id="docket" transform="translate(25, 220) rotate(-8)">
      <rect x="0" y="0" width="70" height="90" rx="4" stroke-width="3" />
      <line x1="12" y1="18" x2="58" y2="18" stroke-width="2" />
      <line x1="12" y1="28" x2="58" y2="28" stroke-width="1.8" opacity="0.7" />
      <line x1="12" y1="38" x2="50" y2="38" stroke-width="1.8" opacity="0.7" />
      <line x1="12" y1="48" x2="54" y2="48" stroke-width="1.8" opacity="0.7" />
      
      <!-- Seal / Exhibit Stamp -->
      <circle cx="35" cy="68" r="12" stroke-width="2" />
      <text x="35" y="72" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle" stroke="none" fill="#b8860b">EX-X</text>
    </g>

    <!-- Sound / Verdict Shockwave Accents -->
    <path d="M 235 250 Q 255 260 270 280" stroke-width="2.2" opacity="0.5" />
    <path d="M 245 238 Q 275 252 295 282" stroke-width="1.8" opacity="0.3" />
  </g>
</svg>
