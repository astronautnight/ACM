<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="400" height="360">
  <defs>
    <filter id="chalk" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" seed="9" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
      <feMorphology in="displaced" operator="dilate" radius="0.3" result="thickened"/>
      <feGaussianBlur in="thickened" stdDeviation="0.35"/>
    </filter>
  </defs>

  <g filter="url(#chalk)" stroke="#1a8a2e" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- ==================== BACKGROUND SOUND & TECH ARCS ==================== -->
    <path d="M 135 90 Q 115 110 135 130" stroke-width="2.5" opacity="0.6" />
    <path d="M 118 75 Q 90 110 118 145" stroke-width="2" opacity="0.35" />
    
    <path d="M 265 90 Q 285 110 265 130" stroke-width="2.5" opacity="0.6" />
    <path d="M 282 75 Q 310 110 282 145" stroke-width="2" opacity="0.35" />

    <!-- Spark / Accents -->
    <path d="M 85 45 L 85 57 M 79 51 L 91 51" stroke-width="1.8" opacity="0.4" />
    <path d="M 315 45 L 315 57 M 309 51 L 321 51" stroke-width="1.8" opacity="0.4" />


    <!-- ==================== 1. PIANO KEYBOARD (LEFT) ==================== -->
    <g transform="translate(24, 195) rotate(-14)">
      <!-- Chassis -->
      <rect x="0" y="0" width="145" height="66" rx="6" stroke-width="3.5" />

      <!-- White Keys Separators -->
      <line x1="18" y1="0" x2="18" y2="66" stroke-width="2.2" />
      <line x1="36" y1="0" x2="36" y2="66" stroke-width="2.2" />
      <line x1="54" y1="0" x2="54" y2="66" stroke-width="2.2" />
      <line x1="72" y1="0" x2="72" y2="66" stroke-width="2.2" />
      <line x1="90" y1="0" x2="90" y2="66" stroke-width="2.2" />
      <line x1="108" y1="0" x2="108" y2="66" stroke-width="2.2" />
      <line x1="126" y1="0" x2="126" y2="66" stroke-width="2.2" />

      <!-- Black Keys (Outlines) -->
      <rect x="11" y="0" width="13" height="38" rx="2" stroke-width="3" />
      <rect x="29" y="0" width="13" height="38" rx="2" stroke-width="3" />
      <rect x="65" y="0" width="13" height="38" rx="2" stroke-width="3" />
      <rect x="83" y="0" width="13" height="38" rx="2" stroke-width="3" />
      <rect x="101" y="0" width="13" height="38" rx="2" stroke-width="3" />

      <!-- Music Note Outlines -->
      <circle cx="22" cy="-18" r="4.5" stroke-width="2.2" />
      <circle cx="44" cy="-42" r="4" stroke-width="2.2" />
      <line x1="26.5" y1="-18" x2="26.5" y2="-38" stroke-width="2" />
      <line x1="48" y1="-42" x2="48" y2="-62" stroke-width="2" />
      <line x1="26.5" y1="-38" x2="48" y2="-62" stroke-width="3" />
    </g>


    <!-- ==================== 2. COMPUTER KEYBOARD (RIGHT) ==================== -->
    <g transform="translate(232, 210) rotate(14)">
      <!-- Chassis -->
      <rect x="0" y="0" width="146" height="72" rx="6" stroke-width="3.5" />

      <!-- Row 1: Function Keys -->
      <rect x="8" y="7" width="15" height="11" rx="2" stroke-width="1.8" />
      <rect x="27" y="7" width="15" height="11" rx="2" stroke-width="1.8" />
      <rect x="46" y="7" width="15" height="11" rx="2" stroke-width="1.8" />
      <rect x="65" y="7" width="15" height="11" rx="2" stroke-width="1.8" />
      <rect x="84" y="7" width="15" height="11" rx="2" stroke-width="1.8" />
      <rect x="103" y="7" width="15" height="11" rx="2" stroke-width="1.8" />
      <rect x="122" y="7" width="16" height="11" rx="2" stroke-width="1.8" />

      <!-- Row 2: Letters / QWERTY -->
      <rect x="8" y="22" width="18" height="11" rx="2" stroke-width="1.8" />
      <rect x="30" y="22" width="14" height="11" rx="2" stroke-width="1.8" />
      <rect x="48" y="22" width="14" height="11" rx="2" stroke-width="1.8" />
      <rect x="66" y="22" width="14" height="11" rx="2" stroke-width="1.8" />
      <rect x="84" y="22" width="14" height="11" rx="2" stroke-width="1.8" />
      <rect x="102" y="22" width="14" height="11" rx="2" stroke-width="1.8" />
      <rect x="120" y="22" width="18" height="11" rx="2" stroke-width="1.8" />

      <!-- Row 3: ASDF & Enter -->
      <rect x="8" y="37" width="22" height="11" rx="2" stroke-width="1.8" />
      <rect x="34" y="37" width="14" height="11" rx="2" stroke-width="1.8" />
      <rect x="52" y="37" width="14" height="11" rx="2" stroke-width="1.8" />
      <rect x="70" y="37" width="14" height="11" rx="2" stroke-width="1.8" />
      <rect x="88" y="37" width="14" height="11" rx="2" stroke-width="1.8" />
      <rect x="106" y="37" width="32" height="11" rx="2" stroke-width="2.2" />

      <!-- Row 4: Spacebar & Modifiers -->
      <rect x="8" y="52" width="16" height="13" rx="2" stroke-width="1.8" />
      <rect x="28" y="52" width="14" height="13" rx="2" stroke-width="1.8" />
      <rect x="46" y="52" width="56" height="13" rx="3" stroke-width="2.2" />
      <rect x="106" y="52" width="14" height="13" rx="2" stroke-width="1.8" />
      <rect x="124" y="52" width="14" height="13" rx="2" stroke-width="1.8" />

      <!-- Tech cable -->
      <path d="M 73 0 C 73 -14, 92 -12, 88 -26" stroke-width="1.8" stroke-dasharray="3, 3" opacity="0.6" />
    </g>


    <!-- ==================== 3. STUDIO MICROPHONE (CENTER) ==================== -->
    <g id="microphone">
      <!-- Microphone Capsule -->
      <rect x="175" y="60" width="50" height="92" rx="25" stroke-width="3.5" />
      
      <!-- Inner Grid / Ribs -->
      <line x1="175" y1="90" x2="225" y2="90" stroke-width="2.2" />
      <line x1="175" y1="106" x2="225" y2="106" stroke-width="3" />
      <line x1="175" y1="122" x2="225" y2="122" stroke-width="2.2" />
      
      <line x1="190" y1="64" x2="190" y2="148" stroke-width="1.8" opacity="0.6" />
      <line x1="200" y1="60" x2="200" y2="152" stroke-width="2.5" />
      <line x1="210" y1="64" x2="210" y2="148" stroke-width="1.8" opacity="0.6" />

      <!-- U-Shaped Shockmount Swivel -->
      <path d="M 163 100 L 163 125 C 163 165, 237 165, 237 125 L 237 100" stroke-width="3.5" />
      <circle cx="163" cy="112" r="3.5" stroke-width="2.5" />
      <circle cx="237" cy="112" r="3.5" stroke-width="2.5" />

      <!-- Stand Stem & Joint -->
      <line x1="200" y1="155" x2="200" y2="230" stroke-width="3.5" />
      <rect x="192" y="196" width="16" height="8" rx="2" stroke-width="2.5" />

      <!-- Base Stand -->
      <ellipse cx="200" cy="235" rx="42" ry="14" stroke-width="3.5" />
      <ellipse cx="200" cy="235" rx="26" ry="8" stroke-width="2" opacity="0.5" />
    </g>

  </g>
</svg>
