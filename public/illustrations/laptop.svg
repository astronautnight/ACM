<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="chalk" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" seed="5" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
      <feMorphology in="displaced" operator="dilate" radius="0.3" result="thickened"/>
      <feGaussianBlur in="thickened" stdDeviation="0.4"/>
    </filter>
  </defs>
  <g filter="url(#chalk)" stroke="#e31b23" fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Screen Outer Edge -->
    <polygon points="50,60 250,40 270,160 70,190" />
    
    <!-- Screen Inner Bezel -->
    <polygon points="65,70 238,52 255,152 82,176" stroke-width="3" opacity="0.8"/>
    
    <!-- Keyboard Deck (Base Top) -->
    <polygon points="70,190 270,160 360,225 150,270" />
    
    <!-- Laptop Bottom Thickness -->
    <polygon points="70,190 150,270 150,285 70,205" />
    <polygon points="150,270 360,225 360,240 150,285" />
    
    <!-- Keyboard Area Background/Border -->
    <polygon points="100,198 250,172 320,215 170,240" stroke-width="2.5" opacity="0.9"/>
    
    <!-- Horizontal Key Rows (Perspective) -->
    <line x1="110" y1="205" x2="260" y2="178" stroke-width="2.5"/>
    <line x1="120" y1="212" x2="272" y2="185" stroke-width="2.5"/>
    <line x1="130" y1="220" x2="285" y2="192" stroke-width="2.5"/>
    <line x1="145" y1="228" x2="300" y2="200" stroke-width="2.5"/>
    <line x1="160" y1="237" x2="315" y2="208" stroke-width="2.5"/>
    
    <!-- Vertical Key Separators (Approximation for chalk look) -->
    <line x1="125" y1="200" x2="165" y2="235" stroke-width="2" opacity="0.6"/>
    <line x1="145" y1="195" x2="185" y2="230" stroke-width="2" opacity="0.6"/>
    <line x1="165" y1="192" x2="205" y2="225" stroke-width="2" opacity="0.6"/>
    <line x1="185" y1="188" x2="225" y2="220" stroke-width="2" opacity="0.6"/>
    <line x1="205" y1="185" x2="245" y2="215" stroke-width="2" opacity="0.6"/>
    <line x1="225" y1="181" x2="265" y2="210" stroke-width="2" opacity="0.6"/>
    <line x1="245" y1="178" x2="285" y2="205" stroke-width="2" opacity="0.6"/>
    
    <!-- Trackpad -->
    <polygon points="210,245 280,225 300,245 230,265" stroke-width="3"/>
  </g>
</svg>
