<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <filter id="chalk" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="5" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
      <feMorphology in="displaced" operator="dilate" radius="0.4" result="thickened"/>
      <feGaussianBlur in="thickened" stdDeviation="0.3"/>
    </filter>
  </defs>
  <g filter="url(#chalk)" stroke="#e07020" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Speaker body -->
    <rect x="35" y="25" width="230" height="350" rx="22"/>
    <!-- Inner frame -->
    <rect x="50" y="40" width="200" height="320" rx="16" stroke-width="2" opacity="0.4"/>
    <!-- Tweeter (top speaker) -->
    <circle cx="150" cy="105" r="38"/>
    <circle cx="150" cy="105" r="24"/>
    <circle cx="150" cy="105" r="10" stroke-width="2.5"/>
    <!-- Brand / display area -->
    <rect x="105" y="155" width="90" height="18" rx="6" stroke-width="2.5"/>
    <line x1="115" y1="164" x2="140" y2="164" stroke-width="1.5" opacity="0.5"/>
    <!-- Volume / control knobs -->
    <circle cx="80" cy="170" r="8" stroke-width="2.5"/>
    <line x1="80" y1="162" x2="80" y2="167" stroke-width="2"/>
    <circle cx="220" cy="170" r="8" stroke-width="2.5"/>
    <line x1="220" y1="162" x2="220" y2="167" stroke-width="2"/>
    <!-- Main driver (bottom speaker) -->
    <circle cx="150" cy="270" r="65"/>
    <circle cx="150" cy="270" r="50"/>
    <circle cx="150" cy="270" r="32" stroke-width="2.5"/>
    <circle cx="150" cy="270" r="15" stroke-width="2"/>
    <circle cx="150" cy="270" r="5" stroke-width="2"/>
    <!-- Cone texture lines -->
    <line x1="125" y1="240" x2="140" y2="258" stroke-width="1.5" opacity="0.3"/>
    <line x1="170" y1="245" x2="160" y2="258" stroke-width="1.5" opacity="0.3"/>
    <line x1="130" y1="295" x2="142" y2="283" stroke-width="1.5" opacity="0.3"/>
    <line x1="175" y1="290" x2="162" y2="280" stroke-width="1.5" opacity="0.3"/>
    <!-- Port at bottom -->
    <rect x="120" y="348" width="60" height="10" rx="5" stroke-width="2"/>
  </g>
</svg>
