<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="240" height="300">
  <defs>
    <filter id="chalk" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="5" seed="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
      <feMorphology in="displaced" operator="dilate" radius="0.4" result="thickened"/>
      <feGaussianBlur in="thickened" stdDeviation="0.3"/>
    </filter>
  </defs>
  <g filter="url(#chalk)" stroke="#1a8a2e" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Mouse body outline -->
    <path d="M 120 30 Q 185 30 190 85 L 192 195 Q 192 265 120 270 Q 48 265 48 195 L 50 85 Q 55 30 120 30 Z"/>
    <!-- Center divider line -->
    <line x1="120" y1="30" x2="120" y2="130"/>
    <!-- Scroll wheel -->
    <ellipse cx="120" cy="80" rx="12" ry="22" stroke-width="3"/>
    <!-- Scroll wheel detail lines -->
    <line x1="114" y1="70" x2="126" y2="70" stroke-width="1.5" opacity="0.4"/>
    <line x1="114" y1="80" x2="126" y2="80" stroke-width="1.5" opacity="0.4"/>
    <line x1="114" y1="90" x2="126" y2="90" stroke-width="1.5" opacity="0.4"/>
    <!-- Click area curve -->
    <path d="M 50 130 Q 70 142 120 145 Q 170 142 190 130" stroke-width="2.5"/>
    <!-- Left side grip texture -->
    <line x1="52" y1="160" x2="52" y2="175" stroke-width="2" opacity="0.4"/>
    <line x1="52" y1="185" x2="52" y2="200" stroke-width="2" opacity="0.4"/>
    <line x1="52" y1="210" x2="52" y2="225" stroke-width="2" opacity="0.4"/>
    <!-- Right side grip texture -->
    <line x1="188" y1="160" x2="188" y2="175" stroke-width="2" opacity="0.4"/>
    <line x1="188" y1="185" x2="188" y2="200" stroke-width="2" opacity="0.4"/>
    <line x1="188" y1="210" x2="188" y2="225" stroke-width="2" opacity="0.4"/>
    <!-- Bottom curve detail -->
    <path d="M 75 250 Q 120 260 165 250" stroke-width="2" opacity="0.3"/>
  </g>
</svg>
